[package]
name = "jaster"
version = "2.0.3"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rodio = "0.21"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "3"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",          # raw mode for the sound picker
    "Win32_System_LibraryLoader",    # GetModuleHandleW
    "Win32_System_Threading",        # process liveness and termination
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",  # WH_KEYBOARD_LL and its message pump
] }
