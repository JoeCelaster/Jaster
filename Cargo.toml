[package]
name = "jaster"
version = "2.2.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rodio = "0.21"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "3"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
# Not called directly — this is how the feature reaches the cpal that rodio
# pulls in. Without it cpal's WASAPI render thread runs at ordinary priority,
# and anything busy on the machine delays the click after the keystroke; with
# it the thread is registered with MMCSS as pro-audio work.
cpal = { version = "0.16", features = ["audio_thread_priority"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",          # raw mode for the sound picker
    "Win32_System_LibraryLoader",    # GetModuleHandleW
    "Win32_System_Threading",        # process liveness and termination
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",  # WH_KEYBOARD_LL and its message pump
] }
