name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # evdev is pure Rust; ALSA is all rodio needs. The X11 packages were
      # only ever for rdev, which Jaster no longer depends on.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev

      - name: Build
        run: cargo build --release

      - name: Make installer executable
        run: chmod +x scripts/install.sh

      - name: Package Release
        run: |
          mkdir jaster
          cp target/release/jaster jaster/jaster
          cp scripts/install.sh jaster/install.sh
          cp -r assets jaster/

          tar -czf jaster-linux-x86_64.tar.gz jaster

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: jaster-linux-x86_64.tar.gz

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # No system dependencies: WASAPI and the keyboard hook are part of the OS.
      - name: Build
        run: cargo build --release

      - name: Package Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory jaster | Out-Null
          Copy-Item target\release\jaster.exe jaster\jaster.exe
          Copy-Item scripts\install.ps1 jaster\install.ps1
          Copy-Item assets -Destination jaster\assets -Recurse

          Compress-Archive -Path jaster -DestinationPath jaster-windows-x86_64.zip

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: jaster-windows-x86_64.zip
