name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libx11-dev \
            libxtst-dev \
            libxi-dev \
            libxrandr-dev

      - name: Build
        run: cargo build --release

      - name: Make installer executable
        run: chmod +x scripts/install.sh

      - name: Package Release
        run: |
          mkdir jaster
          cp target/release/jaster jaster/jaster
          cp scripts/install.sh jaster/install.sh
          cp -r assets jaster/

          tar -czf jaster-linux-x86_64.tar.gz jaster

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: jaster-linux-x86_64.tar.gz